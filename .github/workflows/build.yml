name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/pmrs.exe dist/pmrs-windows-x64.exe
          Copy-Item target/release/pmrs-gui.exe dist/pmrs-gui-windows-x64.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/pmrs-windows-x64.exe, dist/README.md -DestinationPath dist/pmrs-windows-x64.zip -Force
          Compress-Archive -Path dist/pmrs-gui-windows-x64.exe, dist/README.md -DestinationPath dist/pmrs-gui-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pmrs-windows-x64
          path: dist/pmrs-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pmrs-gui-windows-x64
          path: dist/pmrs-gui-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build universal (arm64 + x86_64)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/pmrs-macos-universal \
            target/aarch64-apple-darwin/release/pmrs \
            target/x86_64-apple-darwin/release/pmrs
          lipo -create -output dist/pmrs-gui-macos-universal \
            target/aarch64-apple-darwin/release/pmrs-gui \
            target/x86_64-apple-darwin/release/pmrs-gui
          chmod +x dist/pmrs-macos-universal
          chmod +x dist/pmrs-gui-macos-universal
          codesign --force --sign - dist/pmrs-macos-universal || true
          codesign --force --sign - dist/pmrs-gui-macos-universal || true
          lipo -info dist/pmrs-macos-universal
          lipo -info dist/pmrs-gui-macos-universal
      - name: Package
        run: |
          cd dist
          tar -czf pmrs-macos-universal.tar.gz pmrs-macos-universal pmrs-gui-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: pmrs-macos-universal
          path: dist/pmrs-macos-universal.tar.gz

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pmrs dist/pmrs-linux-x64
          cp target/release/pmrs-gui dist/pmrs-gui-linux-x64
          chmod +x dist/pmrs-linux-x64
          chmod +x dist/pmrs-gui-linux-x64
          tar -czf dist/pmrs-linux-x64.tar.gz -C dist pmrs-linux-x64 pmrs-gui-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: pmrs-linux-x64
          path: dist/pmrs-linux-x64.tar.gz
