[package]
name = "postman-rs"
version = "0.1.0"
edition = "2021"
description = "A local, account-free, payment-free Postman-style API client (Rust replica of Postman local features)"
license = "MIT OR Apache-2.0"

[lib]
name = "postman_rs"
path = "src/lib.rs"

[[bin]]
name = "pmrs"
path = "src/main.rs"

[[bin]]
name = "pmrs-gui"
path = "src/bin/gui.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "gzip", "brotli", "deflate", "cookies", "socks"] }
anyhow = "1"
thiserror = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
url = "2"
base64 = "0.22"
csv = "1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde_yaml = "0.9"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 2

